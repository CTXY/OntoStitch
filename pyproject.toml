[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cortex"
version = "0.2.0"
description = "AutoOnto: ontology learning and online guidance for NL2SQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27,<1",
  "langchain>=1.4,<1.5",
  "langchain-openai>=1.0,<2",
  "langsmith>=0.10,<1",
  "openpyxl>=3.1",
  "pydantic>=2.11,<3",
  "pymysql>=1.1",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[project.scripts]
cortex = "cortex.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]
artifacts = [
  "src/cortex/capabilities/graph_merge/llm/prompts/**/*.md",
  "src/cortex/capabilities/sql_training/**/*.md",
  "src/cortex/capabilities/sql_training/**/*.yaml",
  "src/cortex/capabilities/online_context/**/*.md",
  "src/cortex/capabilities/retrieve_db/**/*.md",
  "src/cortex/schema/roots/*.json",
]
